name: Inspeccionar API REE
on:
  push:
    paths: ['.github/workflows/inspect-ree.yml']
jobs:
  i:
    runs-on: ubuntu-latest
    steps:
      - run: |
          D=$(TZ=Europe/Madrid date +%F); M=$(TZ=Europe/Madrid date -d tomorrow +%F)
          U="https://apidatos.ree.es/es/datos/mercados/precios-mercados-tiempo-real?start_date=${D}T00:00&end_date=${M}T23:59&time_trunc=hour"
          echo $U; curl -sS -A "Mozilla/5.0" "$U" -o r.json; ls -la r.json; head -c 1500 r.json; echo
          python3 -c "
          import json;d=json.load(open('r.json'))
          for inc in d.get('included',[]):
            v=inc['attributes']['values'];print(inc['type'],inc['attributes'].get('title'),len(v),v[:2],v[-1:])"
